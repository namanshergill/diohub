name: dynamic_sliver_app_bar
description: "A SliverAppBar that automatically adjusts its height based on content and supports smooth animations."
version: 2.0.0
homepage: https://github.com/yourusername/dynamic_sliver_app_bar
repository: https://github.com/yourusername/dynamic_sliver_app_bar

environment:
  sdk: ^3.6.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  sliver_tools: ^0.2.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


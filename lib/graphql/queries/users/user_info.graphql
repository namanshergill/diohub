# import '../issues_pulls/timeline.graphql'

query searchMentionUsers($query: String!, $after: String){
    search(query: $query, type: USER, first: 20, after: $after) {
        edges {
            node {
                __typename
                ... on User{
                    ...actor
                } ... on Organization{
                    ...actor
                }
            }
            cursor
        }
    }
}

query getUserPinnedRepos($user: String!){
    user(login: $user) {
        pinnedItems(first: 6, types:[REPOSITORY]){
            edges {
                node {
                    __typename ... on Repository {
                        ...repositoryFields
                    }
                }
            }
        }
    }
}


query followStatusInfo($user:String!){
    user(login: $user) {
        id
        viewerIsFollowing
        viewerCanFollow
        followers {
            totalCount
        }
        pinnedItems(first: 6, types:[REPOSITORY]){
            edges {
                node {
                    __typename ... on Repository {
                        ...repositoryFields
                    }
                }
            }
        }
    }
}

query userInfo($user: String!) {
    user(login: $user) {
        __typename
        id
        login
        name
        avatarUrl
        bio
        location
        websiteUrl
        twitterUsername
        createdAt
        updatedAt
        isViewer
        viewerIsFollowing
        viewerCanFollow
        followers {
            totalCount
        }
        repositories {
            totalCount
        }
        pullRequests {
            totalCount
        }
        issues {
            totalCount
        }
        pinnedItems(first: 6, types:[REPOSITORY,]){
            edges {
                node {
                    __typename ... on Repository {
                        ...repositoryFields
                    }
                }
            }
        }
        ... on User {
            company
            email
            pronouns
            isHireable
            status {
                message
                emoji
                indicatesLimitedAvailability
            }
            following {
                totalCount
            }
            organizations {
                totalCount
            }
            gists {
                totalCount
            }
        }
    }
}

query viewerInfo{
    viewer{
        id
        login
        name
        avatarUrl
        issues(filterBy: {states: OPEN}){
            totalCount
        }
        pullRequests(states: OPEN){
            totalCount
        }
        organizations{
            totalCount
        }
        repositories{
            totalCount
        }

    }
}

mutation  followUser($user:ID!){
    followUser(input: {userId: $user}){
        user{
            login
        }
    }

}

mutation  unfollowUser($user:ID!){
    unfollowUser(input: {userId: $user}){
        user{
            login
        }
    }
}

query getUserRepositories($user: String!, $first: Int!, $after: String, $orderBy: RepositoryOrder) {
    user(login: $user) {
        repositories(first: $first, after: $after, orderBy: $orderBy, affiliations: [OWNER, COLLABORATOR, ORGANIZATION_MEMBER]) {
            edges {
                cursor
                node {
                    id
                    name
                    nameWithOwner
                    description
                    url
                    isPrivate
                    isFork
                    stargazerCount
                    updatedAt
                    createdAt
                    pushedAt
                    primaryLanguage {
                        name
                        color
                    }
                    owner {
                        login
                        avatarUrl
                    }
                }
            }
            pageInfo {
                hasNextPage
                endCursor
            }
        }
    }
}

fragment repositoryFields on Repository {
    name
    description
    stargazerCount
    updatedAt
    url
    isPrivate
    isFork
    owner{
        login
    }
    languages(orderBy: {direction:DESC, field: SIZE}, first:1) {
        edges {
            node {
                name
            }
        }
    }
}

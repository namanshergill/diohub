# import '../issues_pulls/timeline.graphql'

query searchMentionUsers($query: String!, $after: String){
    search(query: $query, type: USER, first: 20, after: $after) {
        edges {
            node {
                __typename
                ... on User{
                    ...actor
                } ... on Organization{
                    ...actor
                }
            }
            cursor
        }
    }
}

query getUserPinnedRepos($user: String!){
    user(login: $user) {
        pinnedItems(first: 6, types:[REPOSITORY]){
            edges {
                node {
                    __typename ... on Repository {
                        ...repositoryFields
                    }
                }
            }
        }
    }
}

# Organizations a user is a public member of. Used by the profile
# Organizations tab.
query getUserOrganizations($user: String!, $cursor: String) {
    user(login: $user) {
        organizations(first: 20, after: $cursor) {
            edges {
                cursor
                node {
                    ...organizationSummary
                }
            }
        }
    }
}

fragment organizationSummary on Organization {
    avatarUrl
    login
    name
    description
    url
    isVerified
    repositories {
        totalCount
    }
}


query followStatusInfo($user:String!){
    user(login: $user) {
        id
        viewerIsFollowing
        viewerCanFollow
        followers {
            totalCount
        }
        pinnedItems(first: 6, types:[REPOSITORY]){
            edges {
                node {
                    __typename ... on Repository {
                        ...repositoryFields
                    }
                }
            }
        }
    }
}

# Fetches a profile for either a user or an organization. GitHub's `user`
# query only resolves User accounts, so `repositoryOwner` is used instead.
query userInfo($user: String!) {
    repositoryOwner(login: $user) {
        __typename
        id
        login
        avatarUrl
        url
        repositories {
            totalCount
        }
        ... on User {
            name
            bio
            location
            websiteUrl
            twitterUsername
            createdAt
            updatedAt
            isViewer
            viewerIsFollowing
            viewerCanFollow
            followers {
                totalCount
            }
            pullRequests {
                totalCount
            }
            issues {
                totalCount
            }
            starredRepositories {
                totalCount
            }
            pinnedItems(first: 6, types:[REPOSITORY,]){
                edges {
                    node {
                        __typename ... on Repository {
                            ...repositoryFields
                        }
                    }
                }
            }
            company
            email
            pronouns
            isHireable
            status {
                message
                emoji
                indicatesLimitedAvailability
            }
            following {
                totalCount
            }
            organizations {
                totalCount
            }
            gists {
                totalCount
            }
        }
        ... on Organization {
            name
            description
            location
            websiteUrl
            twitterUsername
            email
            createdAt
            updatedAt
            isVerified
            viewerCanAdminister
            viewerIsAMember
            membersWithRole {
                totalCount
            }
            publicRepositories: repositories(privacy: PUBLIC) {
                totalCount
            }
            privateRepositories: repositories(privacy: PRIVATE) {
                totalCount
            }
            pinnedItems(first: 6, types:[REPOSITORY,]){
                edges {
                    node {
                        __typename ... on Repository {
                            ...repositoryFields
                        }
                    }
                }
            }
        }
    }
}

query viewerInfo{
    viewer{
        id
        login
        name
        avatarUrl
        issues(filterBy: {states: OPEN}){
            totalCount
        }
        pullRequests(states: OPEN){
            totalCount
        }
        organizations{
            totalCount
        }
        repositories{
            totalCount
        }

    }
}

mutation  followUser($user:ID!){
    followUser(input: {userId: $user}){
        user{
            login
        }
    }

}

mutation  unfollowUser($user:ID!){
    unfollowUser(input: {userId: $user}){
        user{
            login
        }
    }
}

query getUserRepositories($user: String!, $first: Int!, $after: String, $orderBy: RepositoryOrder) {
    user(login: $user) {
        repositories(first: $first, after: $after, orderBy: $orderBy, affiliations: [OWNER, COLLABORATOR, ORGANIZATION_MEMBER]) {
            edges {
                cursor
                node {
                    id
                    name
                    nameWithOwner
                    description
                    url
                    isPrivate
                    isFork
                    stargazerCount
                    updatedAt
                    createdAt
                    pushedAt
                    primaryLanguage {
                        name
                        color
                    }
                    owner {
                        login
                        avatarUrl
                    }
                }
            }
            pageInfo {
                hasNextPage
                endCursor
            }
        }
    }
}

fragment repositoryFields on Repository {
    name
    description
    stargazerCount
    updatedAt
    url
    isPrivate
    isFork
    owner{
        login
        avatarUrl
    }
    primaryLanguage {
        name
        color
    }
    languages(orderBy: {direction:DESC, field: SIZE}, first:1) {
        edges {
            node {
                name
            }
        }
    }
}

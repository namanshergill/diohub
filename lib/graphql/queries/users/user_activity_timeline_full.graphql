# import './user_info.graphql'
# import '../issues_pulls/issue_pull_info.graphql'

# Combined Phase 2 query: Fetch all event types in a single query
# Uses cursors and counts from Phase 1 to fetch exactly what we need
# Includes commits via contributionsCollection (already date-filtered)
# Uses shared fragments (issueInfo, pullInfo, repositoryFields) for type compatibility with card adapters
query userActivityTimelineFull(
  $user: String!
  $from: DateTime!
  $to: DateTime!
  $firstRepos: Int
  $afterRepos: String
  $firstPRs: Int
  $afterPRs: String
  $firstIssues: Int
  $afterIssues: String
  $firstContributions: Int = 100
  $afterContributions: String
) {
  user(login: $user) {
    __typename
    id
    contributionsCollection(from: $from, to: $to) {
      commitContributionsByRepository(maxRepositories: 50) {
        repository {
          __typename
          id
          ...repositoryFields
        }
        contributions(first: $firstContributions, after: $afterContributions) {
          nodes {
            occurredAt
            commitCount
          }
          pageInfo {
            hasNextPage
            endCursor
          }
        }
      }
    }
    repositories(
      first: $firstRepos
      after: $afterRepos
      orderBy: {field: CREATED_AT, direction: DESC}
      affiliations: [OWNER, COLLABORATOR, ORGANIZATION_MEMBER]
    ) {
      edges {
        cursor
        node {
          id
          name
          nameWithOwner
          description
          url
          createdAt
          primaryLanguage {
            name
            color
          }
          ...repositoryFields
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
    pullRequests(
      first: $firstPRs
      after: $afterPRs
      orderBy: {field: CREATED_AT, direction: DESC}
      states: [OPEN, CLOSED, MERGED]
    ) {
      edges {
        cursor
        node {
          ...pullInfo
          # Ensure repository has url field (repoInfo fragment doesn't include it)
          repository {
            url
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
    issues(
      first: $firstIssues
      after: $afterIssues
      orderBy: {field: CREATED_AT, direction: DESC}
      states: [OPEN, CLOSED]
    ) {
      edges {
        cursor
        node {
          ...issueInfo
          # Ensure repository has url field (repoInfo fragment doesn't include it)
          repository {
            url
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}


# import './user_info.graphql'
# import '../issues_pulls/issue_pull_info.graphql'

# Combined Phase 2 query: Fetch all event types in a single query
# Uses cursors and counts from Phase 1 to fetch exactly what we need
# Includes commits via contributionsCollection (already date-filtered)
# Uses shared fragments (issueInfo, pullInfo, repositoryFields) for type compatibility with card adapters
query userActivityTimelineFull(
  $user: String!
  $from: DateTime!
  $to: DateTime!
  $firstRepos: Int
  $afterRepos: String
  $firstPRs: Int
  $afterPRs: String
  $firstIssues: Int
  $afterIssues: String
  $firstContributions: Int = 100
  $afterContributions: String
) {
  user(login: $user) {
    __typename
    id
    contributionsCollection(from: $from, to: $to) {
      commitContributionsByRepository(maxRepositories: 50) {
        repository {
          __typename
          id
          ...repositoryFields
        }
        contributions(first: $firstContributions, after: $afterContributions) {
          nodes {
            occurredAt
            commitCount
          }
          pageInfo {
            hasNextPage
            endCursor
          }
        }
      }
    }
    repositories(
      first: $firstRepos
      after: $afterRepos
      orderBy: {field: CREATED_AT, direction: DESC}
      affiliations: [OWNER, COLLABORATOR, ORGANIZATION_MEMBER]
    ) {
      edges {
        cursor
        node {
          id
          name
          nameWithOwner
          description
          url
          createdAt
          primaryLanguage {
            name
            color
          }
          ...repositoryFields
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
    pullRequests(
      first: $firstPRs
      after: $afterPRs
      orderBy: {field: CREATED_AT, direction: DESC}
      states: [OPEN, CLOSED, MERGED]
    ) {
      edges {
        cursor
        node {
          ...pullInfo
          # Ensure repository has url field (repoInfo fragment doesn't include it)
          repository {
            url
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
    issues(
      first: $firstIssues
      after: $afterIssues
      orderBy: {field: CREATED_AT, direction: DESC}
      states: [OPEN, CLOSED]
    ) {
      edges {
        cursor
        node {
          ...issueInfo
          # Ensure repository has url field (repoInfo fragment doesn't include it)
          repository {
            url
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

# Fragments needed for issueInfo and pullInfo
# These fragments are defined here to ensure they're included in generated types

fragment repositoryFields on Repository {
    name
    description
    stargazerCount
    updatedAt
    url
    isPrivate
    isFork
    owner {
        login
    }
    languages(orderBy: {direction: DESC, field: SIZE}, first: 1) {
        edges {
            node {
                name
            }
        }
    }
}

fragment actor on Actor {
    avatarUrl
    login
}

fragment label on Label {
    color
    name
}

fragment repoInfo on Repository {
    name
    owner {
        login
        avatarUrl
    }
}

fragment assigneeInfo on UserConnection {
    totalCount
    edges {
        cursor
        node {
            ...actor
        }
    }
}

fragment reactionGroups on ReactionGroup {
    content
    viewerHasReacted
    reactors {
        totalCount
    }
    subject {
        id
    }
}

fragment issueInfo on Issue {
    id
    activeLockReason
    assignees(first: 5) {
        ...assigneeInfo
    }
    author {
        ...actor
    }
    authorAssociation
    bodyHTML
    body
    closed
    closedAt
    milestone {
        number
        description
        dueOn
    }
    createdAt
    comments {
        totalCount
    }
    includesCreatedEdit
    isPinned
    labels(first: 100) {
        nodes {
            ...label
        }
    }
    locked
    trackedIssuesCount
    number
    participants(first: 5) {
        totalCount
        nodes {
            ...actor
        }
    }
    projectsV2 {
        totalCount
    }
    reactionGroups {
        ...reactionGroups
    }
    repository {
        ...repoInfo
    }
    state
    titleHTML
    timelineItems {
        totalCount
    }
    url
    userContentEdits {
        totalCount
    }
    viewerCanReact
    viewerCanUpdate
    viewerCanSubscribe
    viewerSubscription
}

fragment pullInfo on PullRequest {
    activeLockReason
    assignees(first: 5) {
        ...assigneeInfo
    }
    author {
        ...actor
    }
    authorAssociation
    bodyHTML
    body
    closed
    closedAt
    createdAt
    comments {
        totalCount
    }
    labels(first: 100) {
        nodes {
            ...label
        }
    }
    locked
    mergedAt
    resourcePath
    number
    participants(first: 5) {
        totalCount
        nodes {
            ...actor
        }
    }
    projectsV2 {
        totalCount
    }
    reactionGroups {
        ...reactionGroups
    }
    repository {
        ...repoInfo
    }
    state
    timelineItems {
        totalCount
    }
    titleHTML
    url
    userContentEdits {
        totalCount
    }
    includesCreatedEdit
    viewerCanReact
    additions
    deletions
    baseRef {
        name
        repository {
            url
        }
    }
    headRef {
        name
        repository {
            url
        }
    }
    changedFiles
    closingIssuesReferences(first: 10) {
        totalCount
        nodes {
            title
            number
            url
            state
            repository {
                name
                owner {
                    login
                }
            }
        }
    }
    commits {
        totalCount
    }
    isCrossRepository
    merged
    reviewDecision
    viewerCanUpdate
}

